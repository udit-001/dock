# Release workflow — builds native, cgo-enabled binaries per OS (Fyne/GLFW
# needs CGO, so we build on each OS's own runner rather than cross-compiling).
# Triggered by `git tag v0.x.x && git push --tags`. Uploads tar.gz archives
# + a merged checksums.txt to the GitHub release.
#
# Distribution model: Linux/macOS users download the binaries; Windows users
# `go install github.com/udit-001/app-store@latest` (or download the .tar.gz).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            deps: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            deps: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            # Preinstalled MSYS2 MinGW (C:\msys64\mingw64\bin\gcc.exe) — no choco
            # install needed. Appended to PATH for the Build step.
            deps: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Module cache: reuses downloaded Go modules across runs.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Build cache: Fyne/GLFW CGO compile is the slowest step; reusing it
      # across runs skips recompiling ~50 packages. Go's cache self-validates
      # content hashes, so a stale entry just triggers a rebuild.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\Users\runneradmin\AppData\Local\go-build' || '~/.cache/go-build' }}
          key: go-build-${{ runner.os }}

      - name: Install build deps
        if: matrix.deps != ''
        shell: bash
        run: ${{ matrix.deps }}

      # Windows PE resource metadata (company/product/version/icon) so the .exe
      # carries legitimate metadata.
      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: ./scripts/gen-winres.sh "${{ github.ref_name }}"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -tags migrated_fynedo \
            -ldflags "-s -w" \
            -o app-store${{ matrix.ext }} ./cmd/app-store

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="app-store_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" app-store${{ matrix.ext }} README.md
          sha256sum "$ARCHIVE" > "dist/checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt"
          mv "$ARCHIVE" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes needs a git repo + tag history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release

      - name: Create release + upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -name 'checksums_*.txt' -exec cat {} \; | sort -k2 > checksums.txt
          gh release create "${{ github.ref_name }}" --generate-notes 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" release/*/app-store_*.tar.gz checksums.txt --clobber
