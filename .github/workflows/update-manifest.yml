name: Update manifest

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch: {}    # manual "regenerate now"
  push:
    paths:
      - internal/appdata/manifest.yaml   # regenerate right after you edit the fleet list

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Resolve latest releases for every app in the embedded manifest and write
      # the repo-root apps.json (served via jsDelivr). The desktop app fetches
      # and caches this at runtime — no embedded copy. Plain
      # github.com/.../releases/download URLs + sha256 from checksums.txt.
      - name: Generate apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./cmd/manifest-gen -manifest internal/appdata/manifest.yaml -out apps.json

      - name: Commit apps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh apps.json"
            git push
          fi