# GoReleaser config for the App Store manager.
# Mirror of the managed fleet's release pipeline: winres PE metadata, ldflags
# version injection, checksums.txt, cross-platform binaries.
#
# Local dry-run:   goreleaser release --snapshot --clean
# Validate config: goreleaser check
# Full release:    git tag v0.x.x && git push --tags

version: 2

project_name: app-store

before:
  hooks:
    - go install github.com/tc-hib/go-winres@latest
    - ./scripts/gen-winres.sh {{ .Version }}

builds:
  - id: app-store
    main: ./cmd/app-store
    binary: app-store
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/udit-001/app-store/internal/version.Version={{.Version}}
      - -X github.com/udit-001/app-store/internal/version.Commit={{.Commit}}
      - -X github.com/udit-001/app-store/internal/version.Date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
          - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: udit-001
    name: app-store
  prerelease: auto
  name_template: 'v{{ .Version }}'

signs:
  - id: cosign
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - --bundle=${artifact}.sigstore.json
      - ${artifact}
      - --yes
    artifacts: checksum

# nfpms / brews / scoops / winget intentionally omitted — first ship is
# `go install` (no MoW, no winget approval wait). Add taps later.